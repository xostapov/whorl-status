# Whorl status page (Upptime). Upload this file to the root of github.com/xostapov/whorl-status,
# replacing the template's .upptimerc.yml. Docs: https://upptime.js.org/docs/configuration
owner: xostapov
repo: whorl-status

# Every 5 minutes GitHub checks each address. 200 = works, anything else = down.
# /api/status/* checks one part of Whorl each (database, files, push, calls…).
sites:
  - name: Сайт и приложение
    url: https://whorl.wtf
    maxResponseTime: 5000
  - name: Сообщения
    url: https://whorl.wtf/api/status/messages
    maxResponseTime: 5000
  - name: Вход и регистрация
    url: https://whorl.wtf/api/status/auth
    maxResponseTime: 5000
  - name: Фото, видео и файлы
    url: https://whorl.wtf/api/status/media
    maxResponseTime: 5000
  - name: Уведомления
    url: https://whorl.wtf/api/status/push
    maxResponseTime: 5000
  - name: Звонки
    url: https://whorl.wtf/api/status/calls
    maxResponseTime: 5000

status-website:
  cname: status.whorl.wtf
  name: Whorl
  logoUrl: data:image/png;base64,
  favicon: data:image/png;base64,
  introTitle: "**Статус Whorl**"
  introMessage: "Работает ли мессенджер прямо сейчас. Проверка каждые 5 минут. Если что-то сломалось — мы уже чиним, а здесь пишем, что происходит."
  theme: dark
  css: ":root{--body-background-color:#070711;--body-text-color:#F7F7FF;--card-background-color:#10101C;--nav-background-color:#0B0B16;--nav-border-bottom-color:#25253A;--nav-current-border-bottom-color:#7047FF;--card-border-color:#25253A;--down-border-left-color:#FF4D6A;--down-background-color:#2A0E18;--degraded-border-left-color:#F59E0B;--up-border-left-color:#22C55E;--tag-color:#070711;--tag-up-background-color:#22C55E;--tag-down-background-color:#FF4D6A;--tag-degraded-background-color:#F59E0B;--change-background-color:#F59E0B;--error-button-border-color:#7047FF;--error-button-background-color:#7047FF;--error-button-color:#fff;--submit-button-border-color:#7047FF;--submit-button-background-color:#7047FF;--submit-button-color:#fff}body{font-family:Inter,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;background-image:radial-gradient(700px 400px at 10% -10%,rgba(112,71,255,.22),transparent 70%),radial-gradient(600px 400px at 100% 0%,rgba(59,130,255,.14),transparent 70%);background-attachment:fixed}a{color:#3B82FF}article,section>div,.card{border-radius:18px}nav img{border-radius:10px}"
  navbar:
    - title: Статус
      href: /
    - title: Открыть Whorl
      href: https://whorl.wtf

